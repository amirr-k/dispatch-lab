openapi: 3.0.3
info:
  title: DispatchLab API
  version: "1"
servers:
  - url: /api/v1

# Every route except those marked public requires a guest token issued by
# POST /guest-sessions, sent as `Authorization: Bearer <token>`. A run is
# reachable only by the session that created it; the WebSocket stream takes
# the token as a `token` query parameter, since a browser cannot set headers
# on a WebSocket handshake.
security:
  - guestToken: []

paths:
  /guest-sessions:
    post:
      summary: Issue a guest token scoping quotas and simulation ownership.
      description: Public. This is the one route that cannot require a session of its own.
      security: []
      responses:
        "201":
          description: Guest session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestSession" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /simulations:
    post:
      summary: Create a new simulation from a seed and algorithm configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSimulationRequest" }
      responses:
        "201":
          description: Simulation created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /simulations/{id}:
    get:
      summary: Fetch simulation metadata and current status.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "200":
          description: Simulation metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
  /simulations/{id}/orders:
    post:
      summary: Place an order (pickup + destination) into a running simulation.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrderRequest" }
      responses:
        "202":
          description: Order command accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No such simulation, or it belongs to another session. }
        "429": { $ref: "#/components/responses/RateLimited" }
  /simulations/{id}/closures:
    post:
      summary: Close a road segment, invalidating any route crossing it.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseRoadRequest" }
      responses:
        "202":
          description: Closure command accepted.
  /simulations/{id}/pause:
    post:
      summary: Pause the simulation clock.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "202": { description: Pause command accepted. }
  /simulations/{id}/resume:
    post:
      summary: Resume the simulation clock.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "202": { description: Resume command accepted. }
  /simulations/{id}/reset:
    post:
      summary: Reset a simulation back to its initial seeded state.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "202": { description: Reset command accepted. }
  /simulations/{id}/replay:
    get:
      # public for a showcase run, which is what makes its URL shareable; a
      # run that has not been saved is readable only by the session that owns
      # it, and reports 404 to anyone else.
      security: []
      summary: >
        Fetch a run's persisted history. Without `at`, returns an ordered page
        of the event log, which the scrubber plays through. With `at`, returns
        the state reconstructed at that sequence instead.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
        - name: fromSequence
          in: query
          description: Exclusive lower bound; events with a higher sequence are returned.
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          description: Maximum events to return. Defaults to 5000, capped at 20000.
          schema: { type: integer, minimum: 1, maximum: 20000 }
        - name: at
          in: query
          description: >
            Reconstruct state at this sequence rather than returning events.
            0 or omitted with the other parameters means the latest sequence.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: An ordered event page, or reconstructed state when `at` is given.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EventPage"
                  - $ref: "#/components/schemas/ReplayState"
        "404": { description: No replay exists for that simulation. }
        "503": { description: This server has no database attached, so no history was recorded. }
  /simulations/{id}/showcase:
    post:
      summary: >
        Retain a run permanently and return the stable URL its replay lives at.
        Writes a final snapshot first, so the stored history ends on the state
        the visitor actually saw.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "200":
          description: Run retained.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShowcaseResult" }
        "404": { description: Simulation not found. }
        "503": { description: This server has no database attached, so runs cannot be saved. }
  /simulations/{id}/stream:
    get:
      summary: WebSocket upgrade for live simulation events. See docs/websocket-protocol.md.
      parameters:
        - $ref: "#/components/parameters/SimulationId"
      responses:
        "101": { description: Switching Protocols. }
  /comparisons:
    post:
      summary: Run a deterministic scenario through baseline and optimized matchers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComparisonRequest" }
      responses:
        "201":
          description: Comparison created (may run asynchronously).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
  /comparisons/{id}:
    get:
      summary: Fetch comparison results.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Comparison result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
  /health/live:
    get:
      summary: Liveness probe.
      security: []
      responses: { "200": { description: OK } }
  /health/ready:
    get:
      summary: Readiness probe. With a database attached, this answers for the database too.
      security: []
      responses:
        "200": { description: OK }
        "503": { description: Store is unreachable. }
  /metrics:
    get:
      summary: Prometheus text exposition of the process metrics. Served outside /api/v1.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format.
          content:
            text/plain: { schema: { type: string } }

components:
  securitySchemes:
    guestToken:
      type: http
      scheme: bearer
      description: A token from POST /guest-sessions.

  responses:
    Unauthorized:
      description: Missing or expired guest session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests, or a session/run limit reached. Carries Retry-After when it is a rate limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Applies to any POST. A repeat of a key already seen for this session
        and path returns the original outcome instead of applying the command
        again, and is marked with an Idempotent-Replay response header.
      schema: { type: string, maxLength: 200 }

    SimulationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Error:
      type: object
      description: Every failure uses this envelope. It never carries internal detail.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: quota
            message: { type: string }

    GuestSession:
      type: object
      required: [token, expiresAt, simulationQuota]
      properties:
        token:
          type: string
          description: 32 random bytes, base64url. The only thing separating one visitor's runs from another's.
        expiresAt:
          type: string
          format: date-time
          description: Extended on use, so an active visitor is never cut off mid-demo.
        simulationQuota:
          type: integer
          description: How many concurrent runs this session may hold.

    CreateSimulationRequest:
      type: object
      required: [seed, algorithm]
      properties:
        seed: { type: integer, format: int64 }
        algorithm: { type: string, enum: [baseline, optimized] }
        cityPreset: { type: string }
        driverCount: { type: integer, minimum: 1, maximum: 200 }

    Simulation:
      type: object
      required: [id, seed, status, virtualTime]
      properties:
        id: { type: string, format: uuid }
        seed: { type: integer, format: int64 }
        algorithm: { type: string, enum: [baseline, optimized] }
        status: { type: string, enum: [running, paused, completed] }
        virtualTime: { type: number }

    PlaceOrderRequest:
      type: object
      required: [pickupNodeId, destinationNodeId]
      properties:
        pickupNodeId: { type: string }
        destinationNodeId: { type: string }

    Order:
      type: object
      required: [id, pickupNodeId, destinationNodeId, status, createdAtVirtualTime]
      properties:
        id: { type: string, format: uuid }
        pickupNodeId: { type: string }
        destinationNodeId: { type: string }
        status: { type: string, enum: [pending, assigned, en_route, delivered, unassignable] }
        assignedDriverId: { type: string, nullable: true }
        createdAtVirtualTime: { type: number }

    CloseRoadRequest:
      type: object
      required: [edgeId]
      properties:
        edgeId: { type: string }

    EventPage:
      type: object
      required: [simulation, events, fromSequence, latestSequence, hasMore]
      properties:
        simulation: { $ref: "#/components/schemas/StoredSimulation" }
        events:
          type: array
          items: { $ref: "#/components/schemas/EventEnvelope" }
        fromSequence: { type: integer }
        latestSequence: { type: integer }
        hasMore: { type: boolean }

    StoredSimulation:
      type: object
      required: [id, seed, drivers, strategy, createdAt, showcase]
      properties:
        id: { type: string }
        seed: { type: integer, format: int64 }
        drivers: { type: integer }
        strategy: { type: string, enum: [baseline, optimized] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        showcase:
          type: boolean
          description: Retained permanently, so its replay URL keeps working.

    ShowcaseResult:
      type: object
      required: [id, showcase, replayUrl]
      properties:
        id: { type: string }
        showcase: { type: boolean }
        replayUrl: { type: string, example: "/replay/bf44ec28003c195d" }

    ReplayState:
      type: object
      description: Simulation state reconstructed at a sequence number.
      required: [simulationId, sequence, virtualTime, nodes, edges, drivers, orders]
      properties:
        simulationId: { type: string }
        sequence: { type: integer }
        virtualTime:
          type: number
          description: >
            The simulation clock at that point. When the reconstruction starts
            from a snapshot taken while nothing was happening, this can be
            ahead of the last event's own virtual time; it never goes backwards
            as the sequence advances.
        nodes:
          type: array
          items: { $ref: "#/components/schemas/CityNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/CityEdge" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/ReplayDriver" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/ReplayOrder" }
        paused: { type: boolean }
        speed: { type: number }

    CityNode:
      type: object
      properties:
        id: { type: string }
        x: { type: number }
        y: { type: number }

    CityEdge:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        closed: { type: boolean }

    ReplayDriver:
      type: object
      properties:
        id: { type: string }
        position: { type: string }
        status: { type: string, enum: [idle, assigned, en_route_to_pickup, delivering, unavailable] }
        route:
          type: array
          items: { type: string }
        routeIndex: { type: integer }
        assignedOrder: { type: string }

    ReplayOrder:
      type: object
      properties:
        id: { type: string }
        pickup: { type: string }
        destination: { type: string }
        status: { type: string, enum: [pending, assigned, en_route, delivered, unassignable] }
        assignedDriver: { type: string }
        createdAtVirtualTime: { type: number }

    EventEnvelope:
      type: object
      required: [schemaVersion, simulationId, sequence, virtualTime, type, payload]
      properties:
        schemaVersion: { type: integer }
        simulationId: { type: string, format: uuid }
        sequence: { type: integer }
        virtualTime: { type: number }
        type: { type: string }
        payload: { type: object }
        traceId:
          type: string
          description: >
            The trace of the request that caused this event, absent for events
            the simulation clock produced on its own.

    CreateComparisonRequest:
      type: object
      required: [seed, cityPreset, demandLevel]
      properties:
        seed: { type: integer, format: int64 }
        cityPreset: { type: string }
        demandLevel: { type: string, enum: [low, medium, high] }
        driverCount: { type: integer, minimum: 1, maximum: 200 }

    Comparison:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, completed] }
        baseline: { $ref: "#/components/schemas/ComparisonRunResult" }
        optimized: { $ref: "#/components/schemas/ComparisonRunResult" }

    ComparisonRunResult:
      type: object
      properties:
        averagePickupTime: { type: number }
        p95PickupTime: { type: number }
        totalTravelDistance: { type: number }
        unassignedOrders: { type: integer }
        assignmentComputeTimeMs: { type: number }
        completedDeliveries: { type: integer }
